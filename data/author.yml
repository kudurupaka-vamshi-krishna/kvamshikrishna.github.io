name: "Dr. K. Vamshi Krishna"
designation: "Institute Postdoctoral Researcher"
institution: "Indian Institute of Technology Bombay (IITB)"
phd_institution: "Indian Institute of Technology Roorkee (IITR)"
bio: >
  Passionate road safety researcher obsessed with human factors and intelligent transportation systems (ITS).
  I turn cutting-edge insights into real-world innovations that protect every road user—driven to advance active
  and passive safety, ITS, assistive and eHMI technologies, and psycho-physiological behavior in transportation engineering.
research_interests:
  - "Human Factors in Active & Passive Road Safety"
  - "Intelligent Transportation Systems (ITS) & ADAS"
  - "External Human-Machine Interfaces (eHMIs) for Autonomous Vehicles"
  - "Assistive Technologies & Haptic Warning Systems"
  - "Surrogate Safety Measures (SSM) & Non-Crash Data"
  - "Virtual Reality (VR) Pedestrian Simulators & Wearable Eye-Tracking"
